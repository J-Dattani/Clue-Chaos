<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clue Chaos - Voting</title>
    
<div id="loader-placeholder"></div>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css"> <!-- Link to your CSS file -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css"> <!-- Font Awesome -->
    <style>
        body {
            margin: 0; 
            height: 100vh; 
            background-image: url('./images/gradient.png'); 
            background-size: cover; 
            background-position: center; 
            backdrop-filter: blur(5px); 
            color: #1A1A2E; 
        }

        .container {
            display: flex;
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            height: 100%; 
            text-align: center; 
        }

        h2 {
            color: #1A1A2E; 
            margin-bottom: 20px; 
        }

        .back-button {
            position: absolute;
            top: 20px; 
            right: 20px; 
        }

        .card-wrapper {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }

        .player-card {
            width: 150px; /* Set fixed width */
            height: 200px; /* Set fixed height */
            border-radius: 10px;
            background-color: #ffffff; /* Card background color */
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s, background-color 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
        }

        .player-card.selected {
            background-color: #d1e7dd; /* Color when selected */
            transform: scale(1.05); /* Slightly increase size on select */
        }

        .radio-input {
            display: none; /* Hide actual radio buttons */
        }

        .player-name {
            margin: 10px 0;
            font-weight: bold;
        }

        #submitVote {
            margin-top: 20px;
        }

        .icon {
            font-size: 50px; /* Icon size */
            color: #1A1A2E; /* Icon color */
            margin-bottom: 10px; /* Space between icon and name */
        }
        /* From Uiverse.io by catraco */ 
.btn-class-name {
    --primary: 255, 90, 120;
    --secondary: 150, 50, 60;
    width: 60px;
    height: 50px;
    border: none;
    outline: none;
    cursor: pointer;
    user-select: none;
    touch-action: manipulation;
    outline: 10px solid rgb(var(--primary), .5);
    border-radius: 100%;
    position: relative;
    transition: .3s;
  }
  
  .btn-class-name .back {
    background: rgb(var(--secondary));
    border-radius: 100%;
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
  }
  
  .btn-class-name .front {
    background: linear-gradient(0deg, rgba(var(--primary), .6) 20%, rgba(var(--primary)) 50%);
    box-shadow: 0 .5em 1em -0.2em rgba(var(--secondary), .5);
    border-radius: 100%;
    position: absolute;
    border: 1px solid rgb(var(--secondary));
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 1.2rem;
    font-weight: 600;
    font-family: inherit;
    transform: translateY(-15%);
    transition: .15s;
    color: rgb(var(--secondary));
  }
  
  .btn-class-name:active .front {
    transform: translateY(0%);
    box-shadow: 0 0;
  }
    </style>
</head>
<body>

    
  <script>
    // Fetch and include loader.html content
    fetch('loader.html')
      .then(response => response.text())
      .then(data => document.getElementById('loader-placeholder').innerHTML = data);
  </script>


  <script>
// loader.js
window.onload = function() {
  // Show the loader for 3 seconds
  setTimeout(function() {
    // Hide the loader after 3 seconds
    document.querySelector('.loader-container').style.display = 'none';
    
    // Show the main page content or redirect to another page
    document.querySelector('.content').style.display = 'block';
    
    // Or if you want to redirect to another page:
    // window.location.href = "your-main-page.html";
  }, 2000); // 3000ms = 3 seconds
};

</script>

    <button class="btn btn-primary back-button" onclick="window.location.href='index.html'">Go Back</button>
    <div class="container mt-5">
        <h2>Vote to Eliminate a Player</h2>
        <div class="card-wrapper" id="voteOptions"></div>
    
<button id="submitVote" class="btn-class-name">
  <span class="back"></span>
  <span class="front"></span>
</button>

    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="scripts/elimination.js"></script>
</body>
</html>
